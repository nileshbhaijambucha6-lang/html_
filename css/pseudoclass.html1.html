<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
          /*unvisited link*/
    a:link{
        color:blue;
    }
    /*visited link*/
    a:visited{
        color:purple;
    }
    /*mouse over link*/
    a:hover{
        color:yellow;
        font-size:25px;
    }
    a:active{
        color:red;
    }
    </style>
</head>
<body>
    <h1>css link pseudo Class</h1>
    <a href="https://www.pinterest.com/">pinterest</a>
    <a href="https://www.instagram.com/">instagram</a>
</body>
</html>
